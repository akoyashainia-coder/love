<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe3e3 0%, #ffd1d1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 154, 162, 0.3);
            backdrop-filter: blur(10px);
            max-width: 85%;
            z-index: 10;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* Sparkling Heartbeat Animation */
        .heart-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px auto;
        }

        .heart {
            background-color: #ff4d6d;
            display: inline-block;
            height: 50px;
            margin: 0 10px;
            position: relative;
            top: 20px;
            transform: rotate(-45deg);
            width: 50px;
            border-radius: 3px;
            animation: heartbeat 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
            box-shadow: 0 0 20px #ff4d6d;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #ff4d6d;
            border-radius: 50%;
            height: 50px;
            position: absolute;
            width: 50px;
        }

        .heart:before {
            top: -25px;
            left: 0;
        }

        .heart:after {
            top: 0;
            left: 25px;
        }

        @keyframes heartbeat {
            0% { transform: scale(0.95) rotate(-45deg); }
            20% { transform: scale(1.1) rotate(-45deg); }
            40% { transform: scale(0.98) rotate(-45deg); }
            60% { transform: scale(1.15) rotate(-45deg); box-shadow: 0 0 30px #ff758f; }
            80% { transform: scale(1) rotate(-45deg); }
            100% { transform: scale(0.95) rotate(-45deg); }
        }

        /* Buttons styling */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            height: 60px;
            align-items: center;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff758f;
            box-shadow: 0 5px 20px rgba(255, 77, 109, 0.4);
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #555;
            position: absolute;
        }

        /* Floating cute icons */
        .floating-emoji {
            position: absolute;
            font-size: 1.5rem;
            bottom: -50px;
            opacity: 0.8;
            animation: floatUp 5s linear infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sparkling Heart -->
        <div class="heart-container">
            <div class="heart"></div>
        </div>

        <h1>Hey Handsome! 🥰</h1>
        <p>Will you be my Valentine and make me the happiest person ever? 🥺👉👈</p>

        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes! 💖</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 🥺</button>
        </div>
    </div>

    <script>
        // Array of cute emojis to float in the background
        const emojis = ['👶', '🍼', '🧸', '💖', '✨', '🥰', '💕', '🌹'];

        // Function to dynamically spawn floating cute icons
        function createFloatingEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('floating-emoji');
            
            // Grab a random cute baby or love emoji
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Randomize position and animation properties
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 3 + 3) + 's'; // Between 3s and 6s
            emoji.style.fontSize = (Math.random() * 1.5 + 1) + 'rem';
            
            document.body.appendChild(emoji);

            // Clean up emoji after it leaves screen
            setTimeout(() => {
                emoji.remove();
            }, 6000);
        }

        // Spawn background emojis automatically
        setInterval(createFloatingEmoji, 400);

        // Make the "No" button run away!
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            
            // Define safe boundaries inside the viewport but away from original spot
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            let randomX = Math.random() * maxX;
            let randomY = Math.random() * maxY;

            // Simple check to keep it from overlapping perfectly on the text container initially
            if (randomX > rect.left && randomX < rect.right && randomY > rect.top && randomY < rect.bottom) {
                randomX = Math.random() * 50; // Force it out to the edges
            }

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Action when he successfully hits "Yes!"
        function celebrate() {
            document.querySelector('.container').innerHTML = `
                <div class="heart-container">
                    <div class="heart" style="animation-duration: 0.5s;"></div>
                </div>
                <h1>YAYYY! 🎉🥳</h1>
                <p style="font-size: 1.4rem;">I knew you'd say yes! You're stuck with me now! 🥰❤️ I love you bunches!</p>
                <div style="font-size: 4rem; animation: heartbeat 1s infinite;">👶🍼🧸💖</div>
            `;
            
            // Shower the screen with extra love emojis
            for(let i = 0; i < 50; i++) {
                setTimeout(createFloatingEmoji, i * 50);
            }
        }
    </script>
</body>
</html>
