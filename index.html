<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Small Request 🥺💸</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.2);
            backdrop-filter: blur(10px);
            max-width: 85%;
            z-index: 10;
        }

        h1 {
            color: #2e7d32;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
            color: #4a4a4a;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* Pulsing Money Bag Icon */
        .money-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            font-size: 5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: moneyPulse 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
            filter: drop-shadow(0 0 15px rgba(76, 175, 80, 0.6));
        }

        @keyframes moneyPulse {
            0% { transform: scale(0.95); }
            20% { transform: scale(1.1); }
            40% { transform: scale(0.98); }
            60% { transform: scale(1.15); }
            80% { transform: scale(1); }
            100% { transform: scale(0.95); }
        }

        /* Buttons styling */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            height: 60px;
            align-items: center;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #2e7d32;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #388e3c;
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #555;
            position: absolute;
        }

        /* Floating Money Bills & Emojis */
        .floating-emoji {
            position: absolute;
            font-size: 1.8rem;
            bottom: -50px;
            opacity: 0.85;
            animation: floatUp 4.5s linear infinite;
            z-index: 1;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pulsing Money Bag -->
        <div class="money-container">💰</div>

        <h1>Hey Handsome! 🥰💸</h1>
        <p>Your favorite girl needs a tiny little blessing... can you send some money? 🥺👉👈💵</p>

        <div class="btn-container">
            <button id="yesBtn" onclick="celebrate()">Yes! 🤑</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 🥺</button>
        </div>
    </div>

    <script>
        // Array of money and cute emojis to float in the background
        const emojis = ['💵', '💸', '💰', '🤑', '✨', '💖', '🥰', '🪙'];

        // Function to dynamically spawn floating cash icons
        function createFloatingEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('floating-emoji');
            
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = (Math.random() * 2.5 + 2.5) + 's'; // Fast floating money
            emoji.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
            
            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 5000);
        }

        // Spawn background cash automatically
        setInterval(createFloatingEmoji, 300);

        // Make the "No" button run away!
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const container = document.querySelector('.container');
            const rect = container.getBoundingClientRect();
            
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            let randomX = Math.random() * maxX;
            let randomY = Math.random() * maxY;

            if (randomX > rect.left && randomX < rect.right && randomY > rect.top && randomY < rect.bottom) {
                randomX = Math.random() * 50; 
            }

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Action when he hits "Yes!"
        function celebrate() {
            document.querySelector('.container').innerHTML = `
                <div class="money-container" style="animation-duration: 0.4s;">🤑</div>
                <h1>THANK YOUUU! 🎉💸</h1>
                <p style="font-size: 1.4rem;">You're literally the best provider ever! Check your bank app, I'm waiting! 🥰❤️ standard transfers accepted!</p>
                <div style="font-size: 4rem; animation: moneyPulse 0.8s infinite;">💰💵💸✨</div>
            `;
            
            // Explosion of cash rains down
            for(let i = 0; i < 60; i++) {
                setTimeout(createFloatingEmoji, i * 40);
            }
        }
    </script>
</body>
</html>
